<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>404 - Page Not Found | ImmersionTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'Inter',sans-serif;background:#F0F4FF;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;}
    h1,h2{font-family:'Poppins',sans-serif;}
    .box{text-align:center;max-width:480px;padding:40px;}
    .code{font-size:100px;font-weight:800;color:#1E3A8A;line-height:1;font-family:'Poppins',sans-serif;}
    h2{font-size:24px;color:#1E293B;margin:16px 0 8px;}
    p{color:#64748B;font-size:15px;line-height:1.6;}
    .btn{display:inline-block;margin-top:24px;padding:12px 28px;background:#2563EB;color:white;border-radius:10px;text-decoration:none;font-weight:600;font-family:'Poppins',sans-serif;}
  </style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="btn">← Go Home</a>
</div>
</body>
</html>
